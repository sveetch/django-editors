{% include "django/forms/widgets/textarea.html" %}{% if widget.init_editor %}
<script>
let {{ widget.attrs.id|slugify }} = new {{ widget.editor.component_name }}({
    "source": document.querySelector("#{{ widget.attrs.id }}"),{% if widget.editor_options %}
    "editor_options": {{  widget.editor_options|safe }},{% endif %}
    "classNames": "form-control"
});
{{ widget.attrs.id|slugify }}.provide();
</script>
{% endif %}
